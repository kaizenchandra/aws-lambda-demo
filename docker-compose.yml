services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.12.0}
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: lambda,apigateway,dynamodb,sqs,sns,s3,iam,sts,kms,events,logs,cloudwatch
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_DOCKER_NETWORK: commerce-local
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - commerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  commerce:
    name: commerce-local
